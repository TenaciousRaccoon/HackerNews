<a href="{{ url }}" class="p-6 hover:bg-slate-100 transition-colors flex flex-col">
  <div class="flex items-center gap-3">
    <span class="text-xs font-semibold p-1 rounded-full bg-orange-500 text-white">
      {{ by }}
    </span>
    <span class="text-xs text-slate-400">{{ time * 1000 | date: 'mediumDate' }}</span>
  </div>
  <h2 class="text-lg font-semibold text-slate-800">{{ title }}</h2>
</a>
